<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- ARGUS Eye Icon -->
  <g transform="translate(10, 10)">
    <path d="M 40 10 C 20 10, 5 35, 5 40 C 5 45, 20 70, 40 70 C 60 70, 75 45, 75 40 C 75 35, 60 10, 40 10 Z" fill="none" stroke="url(#grad1)" stroke-width="6" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="14" fill="url(#grad1)"/>
    <circle cx="40" cy="40" r="6" fill="#0f172a"/>
  </g>
  <!-- Text Branding -->
  <text x="100" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" letter-spacing="3">ARGUS <tspan fill="url(#grad1)">AI</tspan></text>
  <text x="102" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1">ENTERPRISE DATA ANALYST PLATFORM</text>
</svg>
